<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <style>
    body {
        font-family: Arial;
        background: #f5f5f5;
    }
    form {
        width: 300px;
        margin: 100px auto;
        padding: 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
    }
    button {
        background: #007bff;
        color: white;
        border: none;
    }
</style>
</head>
<body>

    <h2>Change Password</h2>

    <form id="passwordForm">
        <label>Email:</label><br>
        <input type="email" id="email" required><br><br>

        <label>Old Password:</label><br>
        <input type="password" id="old_pass" required><br><br>

        <label>New Password:</label><br>
        <input type="password" id="new_pass" required><br><br>

        <button type="submit">Update Password</button>
    </form>

    <p id="message"></p>

    <script>
        document.getElementById("passwordForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const old_pass = document.getElementById("old_pass").value;
            const new_pass = document.getElementById("new_pass").value;

            try {
                const response = await fetch("http://127.0.0.1:5000/forgot_pass", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        old_pass: old_pass,
                        new_pass: new_pass
                    })
                });

                const data = await response.json();

                document.getElementById("message").innerText = data.message;

                if (data.status === "success") {
                    document.getElementById("message").style.color = "green";
                } else {
                    document.getElementById("message").style.color = "red";
                }

            } catch (error) {
                document.getElementById("message").innerText = "Error connecting to server";
                document.getElementById("message").style.color = "red";
            }
        });
    </script>

</body>
</html>
