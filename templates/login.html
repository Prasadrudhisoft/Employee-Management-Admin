<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0e1a;
            --panel: #111827;
            --accent: #e8c87d;
            --accent2: #c9a95c;
            --text: #f0ede6;
            --muted: #7a8099;
            --border: rgba(232, 200, 125, 0.18);
            --glow: rgba(232, 200, 125, 0.08);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Atmospheric background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 50%, rgba(232,200,125,0.07) 0%, transparent 70%),
                radial-gradient(ellipse 40% 60% at 80% 20%, rgba(100,120,200,0.06) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 60% 80%, rgba(232,200,125,0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Grid lines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(232,200,125,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(232,200,125,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            width: 860px;
            min-height: 520px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 40px 120px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Left decorative panel */
        .panel-left {
            flex: 1;
            background: linear-gradient(145deg, #13192e 0%, #0d111f 100%);
            padding: 56px 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .panel-left::before {
            content: '';
            position: absolute;
            top: -80px;
            right: -80px;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 1px solid var(--border);
        }

        .panel-left::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -40px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 1px solid rgba(232,200,125,0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon svg { width: 20px; height: 20px; fill: #0a0e1a; }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--text);
            letter-spacing: 0.02em;
        }

        .panel-content {
            position: relative;
            z-index: 1;
        }

        .panel-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            line-height: 1.2;
            color: var(--text);
            margin-bottom: 16px;
        }

        .panel-content h1 span {
            color: var(--accent);
        }

        .panel-content p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.7;
            max-width: 260px;
        }

        .decorative-dots {
            display: flex;
            gap: 8px;
            margin-top: 32px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }

        .dot.active { background: var(--accent); }

        /* Right form panel */
        .panel-right {
            width: 380px;
            background: var(--panel);
            padding: 56px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .panel-right::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15%;
            bottom: 15%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, var(--border), transparent);
        }

        .form-header {
            margin-bottom: 36px;
            animation: fadeUp 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .form-header p {
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .form-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--text);
        }

        .field {
            margin-bottom: 20px;
            animation: fadeUp 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .field:nth-child(3) { animation-delay: 0.4s; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        input::placeholder { color: rgba(120,130,160,0.6); }

        input:focus {
            border-color: var(--accent);
            background: rgba(232,200,125,0.04);
            box-shadow: 0 0 0 3px rgba(232,200,125,0.08);
        }

        input:focus + svg, .input-wrap:focus-within svg {
            stroke: var(--accent);
        }

        .forgot {
            text-align: right;
            margin-top: -12px;
            margin-bottom: 28px;
            animation: fadeUp 0.8s 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .forgot a {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot a:hover { color: var(--accent); }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            border: none;
            border-radius: 10px;
            color: #0a0e1a;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s;
            animation: fadeUp 0.8s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(232,200,125,0.3);
        }

        button:hover::after { background: rgba(255,255,255,0.08); }
        button:active { transform: translateY(0); }

        .btn-text { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .btn-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(10,14,26,0.3);
            border-top-color: #0a0e1a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            animation: fadeUp 0.8s 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.07);
        }

        .divider span { font-size: 12px; color: var(--muted); }

        .signup-link {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            animation: fadeUp 0.8s 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .signup-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .signup-link a:hover { text-decoration: underline; }

        #message {
            text-align: center;
            font-size: 13px;
            margin-top: 14px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        #message.error {
            display: block;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            color: #f87171;
        }

        #message.success {
            display: block;
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.25);
            color: #4ade80;
        }

        @media (max-width: 700px) {
            .panel-left { display: none; }
            .wrapper { width: 100%; min-height: 100vh; border-radius: 0; }
            .panel-right { width: 100%; padding: 48px 32px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Left decorative panel -->
    <div class="panel-left">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <span class="brand-name">Nexus</span>
        </div>

        <div class="panel-content">
            <h1>Welcome<br>back to <span>your space.</span></h1>
            <p>Sign in to access your dashboard, manage your projects, and stay connected with your team.</p>
            <div class="decorative-dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div style="font-size:12px; color: var(--muted);">© 2025 Nexus Inc. All rights reserved.</div>
    </div>

    <!-- Right form panel -->
    <div class="panel-right">
        <div class="form-header">
            <p>Secure Portal</p>
            <h2>Sign In</h2>
        </div>

        <div class="field">
            <label for="email">Email Address</label>
            <div class="input-wrap">
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
                <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
            </div>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
        </div>

        <div class="forgot"><a href="#">Forgot password?</a></div>

        <button onclick="login()" id="loginBtn">
            <div class="btn-text">
                <div class="btn-spinner" id="spinner"></div>
                <span id="btnLabel">Sign In</span>
            </div>
        </button>

        <div id="message"></div>

        <div class="divider"><span>or</span></div>

        <div class="signup-link">
            Don't have an account? <a href="/register_superadmin">Create one</a>
        </div>
    </div>
</div>

<script>
async function login() {
    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const label = document.getElementById('btnLabel');
    const msg = document.getElementById('message');

    // Loading state
    btn.disabled = true;
    spinner.style.display = 'block';
    label.textContent = 'Signing in...';
    msg.className = '';
    msg.style.display = 'none';

    try {
        const response = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        });

        const data = await response.json();

        if (data.status === "success") {
            label.textContent = '✓ Redirecting...';
            msg.className = 'success';
            msg.textContent = 'Login successful! Redirecting...';
            msg.style.display = 'block';
            setTimeout(() => window.location.href = "/dashboard", 800);
        } else {
            msg.className = 'error';
            msg.textContent = data.message || 'Invalid credentials. Please try again.';
            msg.style.display = 'block';
            btn.disabled = false;
            spinner.style.display = 'none';
            label.textContent = 'Sign In';
        }
    } catch (err) {
        msg.className = 'error';
        msg.textContent = 'Connection error. Please try again.';
        msg.style.display = 'block';
        btn.disabled = false;
        spinner.style.display = 'none';
        label.textContent = 'Sign In';
    }
}

// Enter key support
document.addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
});
</script>
</body>
</html>
